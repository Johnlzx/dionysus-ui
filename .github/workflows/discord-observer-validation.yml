name: Discord Observer Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Send approved validation message
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          node <<'NODE'
          const response = await fetch(process.env.DISCORD_WEBHOOK_URL, {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({
              username: 'Product Observer',
              content: [
                '✅ **Product Observer 冒烟验证成功**',
                '',
                'PR `#1` 判定为非业务变化，置信度 `0.98`。',
                'GitHub PR 收集、过滤、脱敏与 AI 结构化分析链路均已通过；本次未写入 Notion。',
              ].join('\n'),
              allowed_mentions: { parse: [] },
            }),
          });

          if (!response.ok) {
            console.error(`Discord delivery failed with HTTP ${response.status}.`);
            process.exit(1);
          }

          console.log('Discord validation message delivered.');
          NODE
